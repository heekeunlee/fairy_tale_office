<html lang="ko">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  :root {
    --wood-deep: #241C17;
    --wood: #332620;
    --wood-light: #4B392C;
    --parchment: #F3E7CB;
    --parchment-soft: #E7D8B4;
    --brass: #C89A4C;
    --brass-bright: #E7BE79;
    --ink: #241A10;
    --paper-ink: #F6ECD9;
    --muted-paper: #C7B394;
    --hairline: rgba(243, 231, 203, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--wood-light), transparent 60%),
      var(--wood-deep);
    color: var(--paper-ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

  .wrap {
    max-width: 34rem; margin: 0 auto;
    padding: clamp(2rem, 6vw, 3.5rem) clamp(1.1rem, 4vw, 1.5rem) 4rem;
    display: flex; flex-direction: column; gap: 1.4rem;
  }

  .back-link {
    color: var(--brass-bright); text-decoration: none; font-size: .82rem;
    display: inline-flex; align-items: center; gap: .35rem; align-self: flex-start;
  }
  .back-link:hover { text-decoration: underline; }

  .book-header { text-align: center; display: flex; flex-direction: column; gap: .5rem; }
  .eyebrow {
    font-size: .7rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--brass); font-weight: 500; margin: 0;
  }
  .book-header h1 {
    font-family: "Gowun Batang", serif; font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 2rem); margin: 0; letter-spacing: -.01em;
    text-wrap: balance; color: var(--paper-ink);
  }
  .credits {
    font-family: "IBM Plex Mono", monospace; font-size: .72rem;
    color: var(--muted-paper); margin: 0;
  }

  .book {
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-soft) 100%);
    border-radius: 1.2rem;
    padding: clamp(1rem, 4vw, 1.4rem);
    box-shadow: 0 1.5rem 3rem -1.2rem rgba(0,0,0,.6), inset 0 0 0 1px rgba(36,26,16,.06);
    color: var(--ink);
    display: flex; flex-direction: column; gap: 1rem;
  }

  .scene {
    width: 100%; aspect-ratio: 480 / 280; border-radius: .7rem; overflow: hidden;
    background: #1B1730;
  }
  .scene svg { width: 100%; height: 100%; display: block; }
  .silhouette { color: #1B2A22; }

  #leafText { min-height: 5.5rem; }
  #leafText p {
    font-family: "Noto Serif KR", serif; font-size: 1.02rem; line-height: 1.85;
    margin: 0;
  }
  #leafText.climax p {
    text-align: center; font-weight: 700; color: #A3431F; font-size: 1.15rem;
  }
  #leafText.closing {
    text-align: center;
  }
  #leafText.closing .the-end {
    font-family: "Gowun Batang", serif; font-weight: 700; font-size: 1.6rem;
    color: var(--ink); display: block; margin-bottom: .6rem;
  }

  .pager {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    border-top: 1px dashed rgba(36,26,16,.2); padding-top: .8rem;
  }
  .pager button {
    font-family: "IBM Plex Mono", monospace; font-size: .85rem;
    background: var(--wood); color: var(--paper-ink); border: none;
    border-radius: .5rem; padding: .5rem 1rem; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { background: var(--wood-light); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .pager .count { font-family: "IBM Plex Mono", monospace; font-size: .78rem; color: #6B5A3F; }

  footer {
    text-align: center; font-size: .78rem; color: var(--muted-paper); line-height: 1.7;
  }
  footer a { color: var(--brass-bright); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .fade { animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
<defs>

    <stop offset="55%" stop-color="#2E2138"/>

  </radialGradient>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">

    <path d="M38 50 Q43 20 49 2" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M55 50 Q57 18 65 3" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M70 50 Q73 25 78 10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path d="M30 100 Q32 45 26 8" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="26" cy="8" rx="3" ry="8" fill="currentColor"/>

    <circle cx="22" cy="36" r="2.6" fill="#241A10"/><circle cx="38" cy="36" r="2.6" fill="#241A10"/>

      <line x1="50" y1="50" x2="92" y2="50"/><line x1="50" y1="50" x2="84" y2="78"/>
      <line x1="50" y1="50" x2="50" y2="92"/><line x1="50" y1="50" x2="16" y2="78"/>
      <line x1="50" y1="50" x2="8" y2="50"/><line x1="50" y1="50" x2="16" y2="22"/>

</svg>

<div class="wrap">

  <a class="back-link" href="../index.html">← 동화 공방으로</a>

  <header class="book-header">

    <h1>반딧불이 콩콩이, 처음 불을 켜다</h1>
    <p class="credits">기획 이소진 · 집필 최민우 · 심사 박미란 · 삽화 정다은 · v2 · 통과</p>
  </header>

  <div class="book">

  </footer>

<script>
const U = (id, x, y, w, h, cls) => `<use href="#${id}" x="${x}" y="${y}" width="${w}" height="${h}"${cls ? ` class="${cls}"` : ''}/>`;

function scene(inner, warm) {
  const bg = warm ? 'sky-grad-warm' : 'sky-grad';
  return `<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg"><rect width="480" height="280" fill="url(#${bg})"/>${inner}</svg>`;
}

const pages = [
  {
    svg: scene(
      U('i-tree',10,150,70,130,'silhouette') + U('i-tree',60,170,55,110,'silhouette') + U('i-tree',400,160,60,120,'silhouette') +
      U('i-moon',205,15,55,55) +
      U('i-firefly-on',120,95,20,20) + U('i-firefly-on',185,60,20,20) + U('i-firefly-on',260,115,20,20) + U('i-firefly-on',320,75,20,20) + U('i-firefly-on',235,150,20,20)
    ),
    text: `<p>여름밤, 숲속에 작은 반딧불이들이 모였어요.<br>이슬 맺힌 풀잎 사이로 서늘한 바람이 살랑 불었어요.<br>"반짝반짝!" "반짝반짝!"<br>친구들은 불을 켜고 이리저리 날아다니며 술래잡기를 했어요.</p>`
  },
  {
    svg: scene(
      U('i-grass',15,210,95,60,'silhouette') + U('i-grass',350,215,100,55,'silhouette') +
      U('i-moon',410,20,42,42) +
      `<g opacity=".45">` + U('i-firefly-on',150,90,16,16) + U('i-firefly-on',220,70,16,16) + U('i-firefly-on',300,100,16,16) + `</g>` +
      U('i-firefly-off',55,222,18,18)
    ),
    text: `<p>콩콩이는 늘 그렇듯, 개울가 근처 풀숲에 꼭꼭 숨어 그 모습을 구경만 했어요.<br>깜빡, 깜빡. 콩콩이는 오늘도 불을 켜지 않았어요.</p>`
  },
  {
    svg: scene(
      U('i-grass',185,225,110,55,'silhouette') +
      U('i-moon',195,12,72,72) +
      U('i-firefly-on',205,203,20,20) + U('i-firefly-off',236,207,18,18)
    ),
    text: `<p>"콩콩아, 같이 놀자!"<br>반짝이가 풀숲을 향해 소리쳤어요.<br>콩콩이는 고개를 절레절레 저었어요.<br>"내 불빛이 이상하게 생겼으면 어떡해... 불을 켰다가 무서운 게 나를 찾아오면 어떡해..."</p><p>반짝이는 억지로 조르지 않았어요. 그냥 콩콩이 옆에 살포시 내려앉아, 함께 달을 올려다봐 주었어요.</p>`
  },
  {
    svg: scene(
      U('i-tree',165,35,130,225,'silhouette') +
      U('i-owl',195,100,70,80,'silhouette') +
      U('i-moon',355,28,50,50) +
      `<g opacity=".4">` + U('i-firefly-on',55,205,14,14) + U('i-firefly-on',430,220,14,14) + `</g>`
    ),
    text: `<p>그때, 나뭇가지 위에서 부엉이 할머니가 눈을 끔뻑였어요.<br>"나도 어릴 때는 날갯소리가 부끄러워서, 나무 위에서 못 내려왔단다."<br>할머니는 잠시 먼 곳을 바라보다 말했어요.<br>"그런데 말이야, 그날 밤 나는 딱 한 번 날아봤어."<br>할머니는 그 말만 남기고 훌쩍 날아가 버렸어요.</p>`
  },
  {
    svg: scene(
      U('i-reeds',255,150,70,110,'silhouette') + U('i-reeds',305,162,58,98,'silhouette') +
      U('i-mole',268,222,55,44,'silhouette') +
      U('i-moon',55,22,42,42)
    ),
    text: `<p>밤이 점점 깊어졌어요.<br>시끄럽던 풀벌레 소리도 어느새 뚝 끊기고, 숲은 고요해졌어요.<br>그런데 저 멀리 개울가에서, 가느다란 울음소리가 들려왔어요.<br>"흑흑... 엄마... 엄마 어디 있어요..."<br>아기 두더지가 갈대숲 사이에 갇혀 길을 잃고 울고 있었어요.</p>`
  },
  {
    svg: scene(
      U('i-tree',-5,140,60,140,'silhouette') + U('i-tree',420,130,60,150,'silhouette') +
      U('i-reeds',190,192,50,88,'silhouette') +
      U('i-firefly-off',203,214,18,18) + U('i-tremble',224,202,28,20) +
      U('i-firefly-on',60,80,18,18) + U('i-firefly-on',150,60,18,18) + U('i-firefly-on',300,90,18,18) + U('i-firefly-on',380,60,18,18) + U('i-firefly-on',415,180,18,18)
    ),
    text: `<p>"찾으러 가자!"<br>반딧불이들이 사방으로 흩어졌어요.<br>하지만 숲은 너무 어둡고 넓어서, 서로 부르는 소리만 엇갈릴 뿐이었어요.</p><p>콩콩이가 숨어 있던 자리는 갈대숲과 가장 가까웠어요.<br>울음소리가 점점 크고, 점점 가깝게 들렸어요.<br>콩콩이의 작은 심장이 두근두근 뛰었어요. 더듬이도 파르르 떨렸어요.</p>`
  },
  {
    svg: scene(
      U('i-grass',195,248,50,32,'silhouette') +
      U('i-burst',185,80,110,110) +
      U('i-firefly-warm',228,118,26,26),
      true
    ),
    text: `<p>콩콩이는 두 눈을 꼭 감았어요.<br>그리고 떨리는 몸을 다잡고, 태어나서 처음으로 배 끝에 힘을 주었어요.</p><p>깜빡... 깜빡... 서툴게 흔들리던 불빛이, 조금씩 조금씩 밝아졌어요.</p>`,
    climax: `<p>깜빡! 콩콩이가 드디어 불을 켰어요!</p>`
  },
  {
    svg: scene(
      U('i-reeds',165,168,60,112,'silhouette') + U('i-reeds',245,175,55,105,'silhouette') +
      U('i-mole',200,228,50,40,'silhouette') + U('i-mole-mother',232,208,68,54,'silhouette') +
      U('i-firefly-warm',185,148,24,24) +
      U('i-firefly-on',115,120,18,18) + U('i-firefly-on',340,108,18,18) + U('i-firefly-on',155,78,18,18) + U('i-firefly-on',300,68,18,18) +
      U('i-moon',28,24,40,40)
    ),
    text: `<p>환하게 켜진 빛을 보고 친구들이 한걸음에 달려왔어요.<br>저 멀리서 두더지 엄마도 그 빛을 보고 달려왔어요.<br>"저기다!"<br>아기 두더지는 엄마 품에 폭 안겼어요.</p>`
  },
  {
    svg: scene(
      U('i-grass',165,225,100,55,'silhouette') +
      U('i-mole-mother',225,190,64,50,'silhouette') +
      U('i-firefly-warm',195,200,24,24) + U('i-firefly-on',158,193,20,20) +
      U('i-moon',378,22,45,45)
    ),
    text: `<p>"고마워, 꼬마 반딧불이야."<br>두더지 엄마가 콩콩이에게 고개를 숙여 인사했어요.<br>콩콩이는 부끄러운 듯 몸을 움츠렸지만, 이내 활짝 웃으며 불빛을 반짝였어요.</p>`
  },
  {
    svg: scene(
      U('i-tree',5,140,60,140,'silhouette') + U('i-tree',415,150,60,130,'silhouette') +
      U('i-grass',150,235,180,45,'silhouette') +
      U('i-firefly-on',140,178,18,18) + U('i-firefly-on',190,163,18,18) + U('i-firefly-on',290,168,18,18) + U('i-firefly-on',340,183,18,18) +
      U('i-firefly-warm',235,150,28,28) +
      U('i-moon',207,18,55,55)
    ),
    text: `<p>그날 이후로 콩콩이는 매일 밤, 친구들과 나란히 앉아 함께 반짝였어요.</p><p>그런데 참 이상하죠. 콩콩이의 불빛만은, 유독 조금 더 크고, 조금 더 따뜻했어요.</p>`
  },
  {
    svg: scene(U('i-moon',210,60,60,60,'') + U('i-firefly-warm',233,150,28,28), true),
    text: `<span class="the-end">끝</span><p>기획 이소진 · 집필 최민우 · 심사 박미란<br>삽화 정다은</p>`,
    closing: true
  }
];

const sceneEl = document.getElementById('scene');
const textEl = document.getElementById('leafText');
const countEl = document.getElementById('count');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let idx = 0;

function render() {
  const p = pages[idx];
  sceneEl.innerHTML = p.svg;
  textEl.innerHTML = (p.text || '') + (p.climax || '');
  textEl.className = [p.climax ? 'climax' : '', p.closing ? 'closing' : ''].join(' ').trim();
  sceneEl.classList.remove('fade'); void sceneEl.offsetWidth; sceneEl.classList.add('fade');
  textEl.classList.add('fade');
  countEl.textContent = `${idx + 1} / ${pages.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === pages.length - 1;
}

prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
nextBtn.addEventListener('click', () => { if (idx < pages.length - 1) { idx++; render(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

render();
</script>
</body>
</html>
